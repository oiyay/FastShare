name: fast_share
description: Cross-platform file sharing app for Android and Windows
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shelf: ^1.4.1
  http: ^1.2.1
  uuid: ^4.4.0
  file_picker: ^8.0.3
  path_provider: ^2.1.3
  path: ^1.9.0
  shared_preferences: ^2.2.3
  # nearby_connections: ^4.1.1  # Note: Add back when implementing Android-to-Android

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
