name: fast_share
description: Cross-platform file sharing app for Android and Windows
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_database: ^11.1.5
  flutter_webrtc: ^0.11.7
  archive: ^3.6.1
  open_filex: ^4.5.3
  crypto: ^3.0.3
  flutter:
    sdk: flutter
  shelf: ^1.4.1
  http: ^1.2.1
  uuid: ^4.4.0
  file_picker: ^8.0.3
  path_provider: ^2.1.3
  path: ^1.9.0
  shared_preferences: ^2.2.3
  permission_handler: ^11.3.1
  nearby_connections: ^3.1.5

dev_dependencies:
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_database: ^11.1.5
  flutter_webrtc: ^0.11.7
  archive: ^3.6.1
  open_filex: ^4.5.3
  crypto: ^3.0.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
