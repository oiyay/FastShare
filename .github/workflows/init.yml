name: Initialize Flutter Project

on:
  workflow_dispatch: # Manual trigger

jobs:
  init:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate platform directories
        run: |
          flutter create . --project-name fast_share --org com.fastshare --platforms android,windows

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f android/ windows/ test/
          git add .
          git diff --cached --quiet || git commit -m "chore: generate Flutter platform directories"
          git push
