name: Build FastShare

on:
  push:
    branches: [master]
  release:
    types: [created]

jobs:
  # ─────────────────────────────────────
  # JOB 1: Build Android APK (Signed Release)
  # ─────────────────────────────────────
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/fastshare-release.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=fastshare-release.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build signed APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FastShare-Android
          path: build/app/outputs/flutter-apk/app-release.apk

  # ─────────────────────────────────────
  # JOB 2: Build Windows EXE
  # ─────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows EXE
        run: flutter build windows --release

      - name: Zip output
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath FastShare-Windows.zip

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: FastShare-Windows
          path: FastShare-Windows.zip

  # ─────────────────────────────────────
  # JOB 3: Publish to GitHub Release
  # ─────────────────────────────────────
  publish:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: FastShare-Android

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: FastShare-Windows

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app-release.apk
            FastShare-Windows.zip
