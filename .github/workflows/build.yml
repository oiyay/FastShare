name: Build FastShare

on:
  push:
    branches: [master]
  release:
    types: [created]
  workflow_run:
    workflows: ["Initialize Flutter Project"]
    types: [completed]

jobs:
  # ─────────────────────────────────────
  # JOB 1: Build Android APK
  # ─────────────────────────────────────
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate platform files if missing
        run: |
          if [ ! -d "android" ]; then
            flutter create . --project-name fast_share --org com.fastshare --platforms android,windows
          fi

      - name: Add Android permissions
        run: |
          # Add required permissions to AndroidManifest.xml
          sed -i 's|<manifest xmlns:android|<manifest xmlns:tools="http://schemas.android.com/tools" xmlns:android|' android/app/src/main/AndroidManifest.xml
          sed -i '/<\/manifest>/i \
              <uses-permission android:name="android.permission.INTERNET"\/>\
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"\/>\
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE"\/>\
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"\/>\
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"\/>\
              <uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES"\/>\
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"\/>\
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"\/>' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FastShare-Android
          path: build/app/outputs/flutter-apk/app-release.apk

  # ─────────────────────────────────────
  # JOB 2: Build Windows EXE
  # ─────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Generate platform files if missing
        shell: pwsh
        run: |
          if (!(Test-Path "windows")) {
            flutter create . --project-name fast_share --org com.fastshare --platforms android,windows
          }

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows EXE
        run: flutter build windows --release

      - name: Zip output
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath FastShare-Windows.zip

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: FastShare-Windows
          path: FastShare-Windows.zip

  # ─────────────────────────────────────
  # JOB 3: Publish to GitHub Release
  # ─────────────────────────────────────
  publish:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: FastShare-Android

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: FastShare-Windows

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app-release.apk
            FastShare-Windows.zip
